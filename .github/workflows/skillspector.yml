name: skillspector

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly re-scan: OSV data and detection patterns move even when files do not.
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Least privilege at workflow scope. Only the `scan` job widens it.
permissions:
  contents: read

concurrency:
  group: skillspector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `security-events: write` exists solely to upload SARIF, and only this job does that.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes. Leaving the token in .git/config lets any later
          # step, including one added by a future contributor, reuse it.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install SkillSpector (pinned by commit, not by tag)
        # A tag is movable; a supply-chain gate must not have a movable supply chain.
        #
        # KNOWN GAP: this pins SkillSpector itself, not its transitive dependency
        # graph, which uv re-resolves from PyPI on every run. Closing it properly
        # means a checked-in uv lockfile and running the scanner through that
        # locked environment, regenerated on every scanner bump. Deliberately
        # deferred, not overlooked — see the spec's risk register.
        run: uv tool install 'git+https://github.com/NVIDIA/skillspector.git@b7241089d7ec15d8b30df980dacbb428214732b9' # v2.11.0

      - name: Tripwire - the scanner must still catch known-bad content
        run: |
          set -uo pipefail
          skillspector scan tests/tripwire --no-llm && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::TRIPWIRE PASSED THE SCAN. SkillSpector did not flag a deliberately malicious fixture, so every other clean result in this run is meaningless. Do not merge anything on the strength of this build."
            exit 1
          fi
          if [ "$rc" -ne 1 ]; then
            echo "::error::Tripwire scan errored (exit $rc) rather than flagging. The scanner is broken, not lenient."
            exit 1
          fi
          echo "Tripwire correctly flagged (exit 1). Scanner is alive."

      - name: No baseline may suppress a finding on executable code
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(baselines/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No baselines in the repository. That is the healthy state."
            exit 0
          fi
          # Rule 1 of baselines/README.md, enforced rather than remembered: a
          # baseline may only ever cover findings on non-executable content. A
          # suppression on code is how a gate gets quietly disabled.
          # uv is already installed in this job; --with pyyaml avoids depending on
          # whatever the runner image happens to ship.
          uv run --quiet --with 'pyyaml==6.0.2' python - "${files[@]}" <<'PY'
          import sys, yaml
          # Allowlist, not a blocklist. A blocklist of executable extensions misses
          # anything unusual or extensionless; this fails closed instead.
          INERT = ('.md', '.markdown', '.txt', '.rst', '.csv', '.json', '.yaml', '.yml')
          bad = 0
          for path in sys.argv[1:]:
              with open(path, encoding='utf-8') as fh:
                  doc = yaml.safe_load(fh) or {}
              rules = doc.get('rules') or []
              if rules:
                  print(f"::error file={path}::'rules:' must stay empty. Rule entries suppress by "
                        f"pattern, covering findings that do not exist yet. Use fingerprints.")
                  bad = 1
              fps = doc.get('fingerprints') or []
              for fp in fps:
                  f = (fp.get('file') or '')
                  if not f.lower().endswith(INERT):
                      # Permitted, but only with evidence: the literal string matched and
                      # the person who read the code and confirmed it is not behavioural.
                      # CI cannot judge whether they were right; it can refuse to let anyone
                      # suppress a code finding without saying what it was.
                      missing = [k for k in ('matched', 'verified_by') if not str(fp.get(k) or '').strip()]
                      if missing:
                          print(f"::error file={path}::Suppressing a finding on executable file "
                                f"{f!r} (rule {fp.get('rule_id')}) requires {' and '.join(missing)}. "
                                f"Give the literal string matched and who verified it - see "
                                f"baselines/README.md.")
                          bad = 1
                  reason = (fp.get('reason') or '').strip().lower()
                  if not reason or 'auto-generated' in reason or reason == 'accepted finding':
                      print(f"::error file={path}::Baseline entry for {f} has a boilerplate reason. "
                            f"Say what was matched and why it is not a defect.")
                      bad = 1
              print(f"{path}: {len(fps)} fingerprint(s) checked")
          sys.exit(bad)
          PY

      - name: Scan every plugin in the catalog
        run: |
          set -uo pipefail
          mkdir -p sarif
          shopt -s nullglob
          dirs=(plugins/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "Catalog is empty - no plugins to scan. The tripwire above proves the scanner works."
            exit 0
          fi
          fail=0
          for p in "${dirs[@]}"; do
            name=$(basename "$p")
            args=(scan "$p" --no-llm --format sarif --output "sarif/${name}.sarif")
            # Baselines live OUTSIDE the plugin directory, like provenance records,
            # so plugins/ stays byte-identical to upstream and drift is an exact diff.
            if [ -f "baselines/${name}.yaml" ]; then
              args+=(--baseline "baselines/${name}.yaml")
              echo "Using baseline: baselines/${name}.yaml"
            fi
            echo "::group::${name}"
            skillspector "${args[@]}" && rc=0 || rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error file=${p}::${name} failed the scan (exit ${rc}). Exit 1 means risk > 50; exit 2 means the scanner errored."
              fail=1
            fi
          done
          exit $fail

      - name: Suppressed findings must be on inert content (scanner-reported paths)
        run: |
          set -uo pipefail
          shopt -s nullglob
          bl=(baselines/*.yaml)
          if [ ${#bl[@]} -eq 0 ]; then
            echo "No baselines. Nothing to verify."
            exit 0
          fi
          # The earlier step checks the 'file' field the baseline declares about
          # itself. That field is NOT part of what the fingerprint matches, so an
          # entry can claim "docs.md" while its hash suppresses a finding in code -
          # demonstrated, not theorised. This step asks the scanner where the
          # suppressed findings actually were.
          fail=0
          for b in "${bl[@]}"; do
            name=$(basename "$b" .yaml)
            p="plugins/${name}"
            if [ ! -d "$p" ]; then
              echo "::error file=${b}::Baseline exists for '${name}' but plugins/${name} does not."
              fail=1; continue
            fi
            # Delete any pre-existing report first. suppressed-*.json is gitignored,
            # but `git add -f` bypasses that, and a committed stale report saying
            # {"suppressed": []} would otherwise be accepted as a fresh clean result.
            rm -f "suppressed-${name}.json"
            skillspector scan "$p" --no-llm --baseline "$b" --show-suppressed \
              --format json --output "suppressed-${name}.json" >/dev/null 2>&1 && rc=0 || rc=$?
            # Exit 1 means the scan completed with risk > 50 - the suppressed list is
            # still valid and must be checked. Exit 2 means the scanner errored, and
            # an errored scan is not evidence of anything.
            if [ "$rc" -gt 1 ]; then
              echo "::error file=${b}::SkillSpector errored (exit ${rc}) while producing the suppressed-findings report for ${name}. Refusing to pass on a check that did not run."
              fail=1; continue
            fi
            if [ ! -f "suppressed-${name}.json" ]; then
              echo "::error file=${b}::No suppressed-findings report was produced for ${name} (scan exit ${rc}). Refusing to pass."
              fail=1; continue
            fi
            uv run --quiet --with 'pyyaml==6.0.2' python - "$b" "suppressed-${name}.json" <<'PY' || fail=1
          import json, sys, yaml
          INERT = ('.md', '.markdown', '.txt', '.rst', '.csv', '.json', '.yaml', '.yml')
          bpath, rpath = sys.argv[1], sys.argv[2]
          with open(rpath, encoding='utf-8') as fh:
              report = json.load(fh)
          with open(bpath, encoding='utf-8') as fh:
              baseline = yaml.safe_load(fh) or {}
          # Files the baseline documents as verified code suppressions. Correlation is by
          # path, not by fingerprint: the scan's match_fingerprint does not correspond to
          # the baseline's hash, so path is the only handle that actually lines up.
          evidenced = {
              (fp.get('file') or '')
              for fp in (baseline.get('fingerprints') or [])
              if str(fp.get('matched') or '').strip() and str(fp.get('verified_by') or '').strip()
          }
          sup = report.get('suppressed') or []
          bad = 0
          for s in sup:
              f = ((s.get('location') or {}).get('file')) or ''
              if f.lower().endswith(INERT):
                  continue
              if f not in evidenced:
                  print(f"::error file={bpath}::A finding the SCANNER places at {f!r} (rule "
                        f"{s.get('id')}) was suppressed, but no baseline entry for that file "
                        f"carries 'matched' and 'verified_by'. Code may be suppressed only with "
                        f"evidence - see baselines/README.md.")
                  bad = 1
          print(f"{bpath}: {len(sup)} suppressed finding(s), scanner-reported paths verified")
          sys.exit(bad)
          PY
          done
          rm -f suppressed-*.json
          exit $fail

      - name: autoinstall.json names only plugins the catalog publishes
        run: |
          set -uo pipefail
          if [ ! -f autoinstall.json ]; then
            echo "No autoinstall.json. Nothing is pushed to endpoints."
            exit 0
          fi
          # HCM install policy is a separate file from marketplace.json on purpose:
          # marketplace.json is read live from main by every endpoint and a parse
          # failure takes the catalog down. Separate files need CI to keep them
          # consistent, so a name here that is not published fails the build rather
          # than making ClaudeDeploy try to install something that does not exist.
          # Plain python3: this step reads JSON only and needs no third-party package.
          python3 - <<'PY'
          import json, sys
          with open('autoinstall.json', encoding='utf-8') as fh:
              policy = json.load(fh)
          with open('.claude-plugin/marketplace.json', encoding='utf-8') as fh:
              catalog = json.load(fh)
          published = {p['name'] for p in catalog.get('plugins', [])}
          auto = policy.get('autoInstall')
          if not isinstance(auto, list):
              print("::error file=autoinstall.json::'autoInstall' must be a list of plugin names.")
              sys.exit(1)
          bad = 0
          seen = set()
          for name in auto:
              if name in seen:
                  print(f"::error file=autoinstall.json::'{name}' is listed twice.")
                  bad = 1
              seen.add(name)
              if name not in published:
                  print(f"::error file=autoinstall.json::'{name}' is marked for fleet-wide "
                        f"auto-install but is not published in marketplace.json. Every endpoint "
                        f"would try to install a plugin that does not exist.")
                  bad = 1
          print(f"autoinstall.json: {len(auto)} pushed, "
                f"{len(published - set(auto))} available on request, {len(published)} published")
          sys.exit(bad)
          PY

      - name: Every published plugin has a provenance record
        run: |
          set -uo pipefail
          # First line is the declared plugin count, then one name per line.
          # Emitting the count lets the loop below prove it actually iterated:
          # a naive `while read` over a failed parse reads nothing, finds nothing
          # missing, and reports a pass - a check that succeeds precisely when it
          # could not do its job. tr -d '\r' keeps it working for a reviewer
          # dry-running this on Windows, where python emits CRLF.
          if ! out=$(python3 - <<'PY' | tr -d '\r'
          import json
          d = json.load(open('.claude-plugin/marketplace.json'))
          names = [p['name'] for p in d['plugins']]
          print(len(names))
          for n in names:
              print(n)
          PY
          ); then
            echo "::error::Could not parse .claude-plugin/marketplace.json. Refusing to report a pass on a catalog that cannot be read."
            exit 1
          fi
          declared=$(printf '%s\n' "$out" | head -1)
          echo "marketplace.json declares ${declared} plugin(s)"
          checked=0; missing=0
          while read -r name; do
            [ -n "$name" ] || continue
            checked=$((checked + 1))
            # A plugin name is interpolated into a path below. Reject anything
            # that is not a plain name, so a crafted entry like "../../etc/x"
            # cannot make this check read outside the repository and report a
            # pass on a file that has nothing to do with the catalog.
            case "$name" in
              *[!A-Za-z0-9._-]* | .* | *..* )
                echo "::error::Plugin name '${name}' is not a plain name. Allowed: letters, digits, dot, underscore, hyphen; no leading dot and no '..'."
                missing=1
                continue
                ;;
            esac
            if [ -f "provenance/${name}.md" ]; then
              echo "ok: ${name} -> provenance/${name}.md"
            else
              echo "::error::Plugin '${name}' is published in marketplace.json but has no provenance/${name}.md. There is no record of where it came from, which commit, or who approved it."
              missing=1
            fi
          done < <(printf '%s\n' "$out" | tail -n +2)
          if [ "$checked" -ne "$declared" ]; then
            echo "::error::Checked ${checked} plugins but marketplace.json declares ${declared}. The check did not cover the catalog."
            exit 1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All ${checked} published plugin(s) have a provenance record."

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('sarif/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: sarif

  no-internal-references:
    name: No internal references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fail on HCM-internal hostnames or private addresses
        run: |
          set -uo pipefail
          # Scan only content paths. Scanning the whole repo would match this file's own pattern
          # and fail every run forever. Do not "improve" this to a bare `.` target.
          # Whole RFC1918 space, not just the subnets HCM happens to use today.
          # A false positive on something like a version number is cheap; a leaked
          # internal address in a public repository is not.
          pattern='\.hcm\.adev|hcm\.local|10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}'
          # Scan every tracked file, excluding only this workflow - whose own pattern
          # string would otherwise match itself and fail the build on every run.
          # Enumerating from git rather than hand-listing directories means a new
          # root-level config file is covered the day it is added, not the day
          # someone remembers to add it here.
          mapfile -t targets < <(git ls-files -- . ':!:.github/workflows/skillspector.yml')
          if [ ${#targets[@]} -eq 0 ]; then
            echo "::error::No tracked files to scan. The guard cannot pass vacuously."
            exit 1
          fi
          echo "Scanning ${#targets[@]} tracked files."
          # `--` so a filename beginning with a hyphen is treated as a path, not an option.
          grep -InE -- "$pattern" "${targets[@]}" && found=0 || found=$?
          if [ "$found" -eq 0 ]; then
            echo "::error::An HCM-internal hostname or private address appears above, in a PUBLIC repository. Remove it before merging."
            exit 1
          fi
          if [ "$found" -ne 1 ]; then
            echo "::error::The guard failed to run (grep exit $found). Treat this as a failure, not a pass."
            exit 1
          fi
          echo "No internal references found."
