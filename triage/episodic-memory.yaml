# Verified against upstream commit 10757690210574421f1df5f35835af8d0c74d984 (tag v1.4.2 == HEAD
# == the sha already installed across HCM - this plugin versions honestly).
#
# Most entries are substring matches on source text. This plugin searches past Claude Code
# conversations, so its vocabulary - sessions, prompts, tools, config paths - IS the scanner's
# keyword list. The identifier fragment `pList` alone accounts for a large share, and a SQL
# parameterised-query placeholder list is reported as "Context Window Stuffing".
#
# TWO ENTRIES ARE REAL FINDINGS, NOT NOISE: SC1 and SC4 on package.json flag unpinned dependency
# ranges. That is accurate. This plugin runs `npm install` inside its own directory on first use
# and upstream ships no lockfile, so what gets installed is not pinned. It is accepted with the
# risk recorded in provenance/episodic-memory.md - not dismissed.
