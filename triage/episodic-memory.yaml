# Triage record - episodic-memory
#
# Verified against upstream commit 10757690210574421f1df5f35835af8d0c74d984
# (tag v1.4.2 == HEAD == the sha already installed across HCM).
#
# Every entry carries `matched` and `verified_by`: nothing here is inert content.
# .json is NOT treated as inert - hooks.json declares a SessionStart command,
# .mcp.json declares an MCP server, package.json declares a postinstall that runs
# on every endpoint. Config that declares what executes gets the same scrutiny as code.
#
# TWO GROUPS ARE REAL FINDINGS, NOT SCANNER NOISE:
#   SC1/SC4 on package.json - unpinned dependency ranges. Accurate. This plugin
#           runs `npm install` on first use with no lockfile.
#   BH1 on hooks/hooks.json - the SessionStart command. That is the capture
#           mechanism HCM wants; declared and documented, not hidden.
# Both are accepted with the risk written down in provenance/episodic-memory.md.
#
# The rest are substring matches. This plugin searches conversations, so its
# vocabulary - sessions, prompts, tools, config paths - is the scanner's keyword list.
